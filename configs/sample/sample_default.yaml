# balanced rate matrice settings
eta: 0.
omega: 0.

# generation settings
sample_steps: 1000
time_distortion: "identity"     # 'uniform', 'cosine', polyinc, polydec, continuous

# 'continuous' time distortion: Kumaraswamy(a, b), f(t)=1-(1-t^a)^b.
distortion_a: 1.0
distortion_b: 1.0
search: False           # 'all' | 'target_guidance' | 'distortion' | 'stochasticity' | 'full_grid' | 'random' | 'sobol' | False

# shared across the searches that sample configs rather than enumerate them
search_n_trials: 25             # trials per num_step
search_seed: 0
search_eta_range: [0.0, 200.0]
search_omega_range: [0.0, 2.0]
search_random_omega_root: 1.0   # omega = lo + (hi-lo)*(1 - u**root); <1 concentrates draws near lo, 1.0 = uniform
search_objective: ratio/average_ratio_mean  # results column the samplers minimize
search_visualize: True          # Optuna's html plots (needs plotly)

# fixed
rdb: 'general'            # general | column | entry
rdb_crit: dummy           # max_marginal | x_t | p_x1_g_xt | x_1 | p_xt_g_x1 | p_xtdt_g_xt | x_0 | xhat_t
                          # abs_state
