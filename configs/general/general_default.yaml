# General settings
name: 'graph-tf-model'      # Warning: 'debug' and 'test' are reserved name that have a special behavior

wandb: 'online'             # online | offline | disabled
gpus: 1                     # Multi-gpu is not implemented on this branch
conditional: false


resume: null            # If resume, path to ckpt file from outputs directory in main directory
test_only: null         # Use absolute path

check_val_every_n_epochs: 10
sample_every_val: 4
val_check_interval: null
samples_to_generate: 512       # We advise to set it to 2 x batch_size maximum
samples_to_save: 20
chains_to_save: 1
log_every_steps: 50
number_chain_steps: 50        # Number of frames in each gif

final_model_samples_to_generate: 50 #10000
final_model_samples_to_save: 30
final_model_chains_to_save: 20
#final_model_samples_to_generate: 3
#final_model_samples_to_save: 2
#final_model_chains_to_save: 1

evaluate_all_checkpoints: False

num_sample_fold: 1
bootstrapping: True
num_bootstrap_fold: 5          # number of subsamples scored per sampling config; each fold scores (K-1)/K of the pool
bootstrap_samples_to_evaluate: null  # graphs scored per fold; null = (K-1)/K of the pool. Must be <= the pool size # Anishok
cache_graph_eval: False         # reuse per-graph validity across folds of one config; also freezes is_sbm_graph's MCMC jitter
save_samples: False
save_visualization: False